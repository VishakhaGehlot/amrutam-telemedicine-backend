services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: amrutam
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only_change_me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d amrutam"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-local_dev_only_change_me}@db:5432/amrutam
      JWT_SECRET: ${JWT_SECRET:-local_dev_secret_replace_before_use_123456789}
      JWT_EXPIRES_IN: 15m
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
