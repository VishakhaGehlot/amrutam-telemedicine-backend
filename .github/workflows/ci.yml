name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: amrutam
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d amrutam"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/amrutam
          JWT_SECRET: ci_only_secret_change_me_1234567890
          NODE_ENV: test
